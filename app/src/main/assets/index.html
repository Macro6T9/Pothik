<!DOCTYPE html>
<html lang="en" data-theme="win">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pothik Browser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Serif+Bengali:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
:root,:root[data-theme="win"]{
  --putty:#cfc9b8;--putty-dark:#a9a28d;--putty-light:#ece7d8;--ink:#1f2a37;
  --teal:#0d5c63;--teal-2:#14808a;--paper:#f7f2e4;--amber:#e3a72f;--red:#a8402b;
  --hi:#fffdf5;--lo:#7c7663;--onbar:#fff;--link:#0d6e78;--ui:"Noto Sans Bengali",Tahoma,Verdana,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --putty:#3a372f;--putty-dark:#24221c;--putty-light:#4a463b;--ink:#efe9d6;
  --teal:#0b4c52;--teal-2:#14808a;--paper:#2a2822;--amber:#e3a72f;--red:#e0705a;
  --hi:#5b5748;--lo:#12110e;--onbar:#fff;--link:#6fd0d8;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--putty);color:var(--ink);font-family:var(--ui);font-size:14px;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.raised{border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);background:var(--putty)}
.sunken{border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:var(--paper)}
.raised:active:not(:disabled){border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
:focus-visible{outline:2px dotted var(--ink);outline-offset:1px}
.muted{color:var(--lo)}
[data-theme="dark"] .muted{color:#a79f8a}

/* title bar */
.titlebar{background:linear-gradient(90deg,var(--teal),var(--teal-2));color:var(--onbar);padding:4px 8px;display:flex;align-items:center;gap:8px;font-weight:700;flex:none}
.logo{font-family:"Courier Prime",monospace;letter-spacing:.5px}
.spacer{flex:1}
.titlebar button{padding:0 8px;line-height:20px;font-size:12px}
.badge{display:none;background:var(--ink);color:var(--paper);padding:0 8px;font-size:12px}
body.private #privBtn{background:var(--ink);color:var(--paper);border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
body.private .titlebar{background:linear-gradient(90deg,#2b2b2b,#5a2d6b);color:#fff}

/* tabs */
.tabs{display:flex;gap:2px;padding:6px 6px 0;overflow-x:auto;flex:none;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:6px;min-width:120px;max-width:190px;padding:4px 6px;border:2px solid;border-bottom:none;
  border-color:var(--hi) var(--lo) transparent var(--hi);background:var(--putty-dark);cursor:pointer;white-space:nowrap;user-select:none}
.tab.active{background:var(--teal);color:var(--onbar);font-weight:700;position:relative;top:2px;padding-bottom:6px;border-top:4px solid var(--amber);border-left-color:var(--teal-2);border-right-color:var(--lo)}
.tab.active .x{color:var(--onbar)}
.tab.active .x:hover{color:var(--amber)}
.tab:not(.active){opacity:.8}
.tab:not(.active):hover{opacity:1;background:var(--putty-light)}
.tab.pinned{min-width:0;padding:4px 8px}
.tab.drop{box-shadow:inset 3px 0 var(--amber)}
.tab .t{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab .x{border:none;background:none;padding:0 3px;font-weight:700}
.tab .x:hover{color:var(--red)}
.fav{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:none;font-size:11px;font-weight:700;color:#fff;font-family:"Courier Prime",monospace}
.newtab{padding:2px 10px;align-self:center;margin-left:4px;font-weight:700}

/* toolbar */
.toolbar{display:flex;gap:5px;align-items:center;padding:6px;flex:none;position:relative}
.tb{min-width:34px;height:32px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tb:disabled{opacity:.4;cursor:default}
.tb.on{border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:var(--putty-light)}
.addrwrap{flex:1;position:relative;min-width:0}
.addr{display:flex;align-items:center;height:32px;padding:0 6px;gap:6px}
.addr:focus-within{outline:2px dotted var(--ink);outline-offset:1px}
.addr input{flex:1;border:none;background:transparent;outline:none;min-width:0;font-family:"Courier Prime",monospace;font-size:14px}
.star{border:none;background:none;font-size:18px;padding:0;line-height:1;color:var(--lo)}
.star.on{color:var(--amber)}
.sugg{position:absolute;left:0;right:0;top:34px;z-index:20;display:none;max-height:50vh;overflow:auto}
.sugg.open{display:block}
.sg{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:6px 8px}
.sg.sel,.sg:hover{background:var(--teal);color:var(--onbar)}
.sg .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg small{opacity:.7;margin-left:6px}
.zoomgrp{display:flex;gap:2px;align-items:center}
.zoomgrp .tb{min-width:28px;padding:0 4px}
.progress{height:3px;flex:none;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--amber);opacity:0}

/* bookmark bar */
.bmbar{display:flex;gap:4px;padding:3px 6px;flex:none;overflow-x:auto;scrollbar-width:none;border-top:2px solid var(--lo);border-bottom:2px solid var(--hi)}
.bm{padding:2px 8px;border:1px solid transparent;background:none;white-space:nowrap;display:flex;gap:6px;align-items:center}
.bm:hover{border-color:var(--hi) var(--lo) var(--lo) var(--hi)}
.hint{display:flex;gap:8px;align-items:center;padding:3px 8px;font-size:12px;flex:none;background:var(--putty-light);border-bottom:1px solid var(--lo)}
.hint button{border:none;background:none;padding:0 4px;font-weight:700}
.hint .lnk{color:var(--link);text-decoration:underline;font-weight:600}

/* stage */
.stage{flex:1;min-height:0;margin:6px}
.view{height:100%;position:relative;display:flex;min-width:0;overflow:hidden}
.pane{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
.view.split .pane+.pane{border-left:3px double var(--lo)}
.panebody{flex:1;position:relative;overflow:hidden}
.zoomwrap{position:absolute;inset:0;overflow:hidden;background:#fff}
.zoomwrap iframe{border:0;background:#fff;transform-origin:0 0;display:block}
.minibar{display:flex;gap:4px;padding:3px;background:var(--putty)}
.minibar input{flex:1;min-width:0;padding:2px 6px;font-family:"Courier Prime",monospace}
.sm{padding:0 8px}
.page{position:absolute;inset:0;overflow:auto;padding:22px 16px 40px;background:var(--paper)}
.inner{max-width:680px;margin:0 auto}
.page h1{font-family:"Courier Prime","Noto Sans Bengali",monospace;font-size:clamp(26px,6vw,40px);margin:0 0 6px;letter-spacing:-1px;line-height:1.1}
.page h2{font-size:15px;margin:26px 0 10px}
.page .sub{margin:0 0 18px;max-width:50ch}

/* home */
.clock{font-family:"Courier Prime","Noto Sans Bengali",monospace;font-size:clamp(44px,13vw,84px);font-weight:700;letter-spacing:-2px;line-height:1}
.date{margin:4px 0 2px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .box{flex:1;min-width:190px;display:flex}
.row .box input{flex:1;height:38px;padding:0 10px;font-size:15px;border:none;background:transparent;outline:none}
.row .box:focus-within{outline:2px dotted var(--ink);outline-offset:1px}
.row select,.row .go{height:38px;padding:0 12px;font-weight:600}
.dial{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.tile .fav{width:34px;height:34px;font-size:17px}
.tile span.n{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* generic page widgets */
.btn{padding:5px 12px;font-weight:600}
.field{padding:6px 8px;width:100%;border:none;background:transparent;outline:none}
.fieldbox{margin-bottom:8px}
.fieldbox:focus-within{outline:2px dotted var(--ink);outline-offset:1px}
.list .it{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px dotted var(--lo)}
.list .it .m{flex:1;min-width:0}
.list .it .m b{display:block;font-weight:600}
.list .it .m small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notes{width:100%;min-height:55vh;padding:12px;resize:vertical;font-family:"Courier Prime","Noto Sans Bengali",monospace;font-size:15px;line-height:1.6;border:none;outline:none;background:transparent}
.calc{max-width:320px;margin:0 auto}
.disp{padding:10px;text-align:right;font-family:"Courier Prime",monospace;font-size:28px;min-height:70px;word-break:break-all}
.disp small{display:block;font-size:14px;opacity:.7;min-height:20px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.keys button{height:48px;font-size:18px;font-weight:700}
.keys .op{background:var(--putty-dark)}
.keys .eq{background:var(--teal);color:var(--onbar)}
.big{font-family:"Courier Prime",monospace;font-size:clamp(40px,12vw,64px);font-weight:700;text-align:center;padding:18px 8px}
.seg{display:flex;gap:0;margin-bottom:12px}
.seg button{flex:1;padding:6px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.sw{padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.sw i{display:block;height:26px;border:1px solid #0006}
.sw.on{outline:3px solid var(--amber)}
table.k{border-collapse:collapse;width:100%}
table.k td{padding:6px 4px;border-bottom:1px dotted var(--lo)}
table.k td:first-child{font-family:"Courier Prime",monospace;white-space:nowrap;padding-right:16px}

/* search engine badges */
.eico{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;color:#fff;font-weight:700;font-family:"Courier Prime",Arial,sans-serif;line-height:1;letter-spacing:-.5px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.engbtn{display:flex;align-items:center;gap:4px;flex:none;border:none;border-right:1px solid var(--lo);background:var(--putty-light);padding:0 8px;color:var(--ink)}
.engbtn:hover{background:var(--putty)}
.engbtn .car{font-size:11px}
.enggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.etile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 10px;min-width:0;text-align:center}
.etile .nm{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.etile small{color:var(--lo);font-size:11px;margin-top:-4px}
.etile .tick{position:absolute;right:6px;top:2px;font-weight:700;color:var(--onbar)}
.etile.on{background:var(--teal);color:var(--onbar);border-color:var(--teal-2) var(--lo) var(--lo) var(--teal-2)}
.etile.on small{color:var(--onbar);opacity:.85}
.popup{max-height:70vh;overflow-y:auto}

/* bottom bar + sheet */
.bottombar{display:flex;justify-content:space-around;gap:6px;padding:6px;flex:none;border-top:2px solid var(--hi)}
.bottombar .tb{flex:1;max-width:200px;height:40px;font-size:15px;font-weight:600}
.stage{position:relative}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:8}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,720px);max-height:88%;z-index:9;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:8px;padding:4px 8px;background:linear-gradient(90deg,var(--teal),var(--teal-2));color:var(--onbar);font-weight:700;flex:none}
.sheet header span{flex:1}
.sheet header button{padding:0 10px;line-height:20px}
.sheet .sbody{overflow:auto;flex:1;min-height:0;background:var(--paper)}
.sheet .page{position:static;inset:auto;overflow:visible;padding:16px 14px 28px}
.sheet .notes{min-height:32vh}
.sheet .page h1{font-size:clamp(22px,5vw,30px)}

/* popup + toast */
.popup{position:fixed;z-index:50;min-width:190px;padding:2px}
.popup button{display:flex;gap:8px;width:100%;border:none;background:none;text-align:left;padding:6px 10px}
.popup button:hover,.popup button:focus-visible{background:var(--teal);color:var(--onbar);outline:none}
.popup hr{border:0;border-top:1px solid var(--lo);margin:3px 0}
.toast{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;padding:8px 14px;background:var(--ink);color:var(--paper);max-width:90vw}
.status{display:flex;gap:6px;padding:3px 6px;font-size:12px;flex:none;border-top:2px solid var(--hi)}
.status .cell{padding:1px 8px;border:1px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.status .fix{flex:none}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:6px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}.progress i{transition:none!important}}
@media (max-width:700px){.hide-sm{display:none!important}.titlebar .full{display:none}.view.split{flex-direction:column}.view.split .pane+.pane{border-left:0;border-top:3px double var(--lo)}}
/* toolbar layout: back/forward left, address centre, reload/home right */
.toolbar{gap:4px}
.addr{height:36px}
.sugg{top:38px}
.tb{height:36px}
.addrwrap{margin:0 2px}
@media (max-width:700px){
  .toolbar{gap:3px;padding:6px 4px}
  .toolbar>.tb{min-width:32px;padding:0 5px}
}

/* ===== polish ===== */
:root{--r:5px;--sh:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.2);--sh-pop:0 8px 26px rgba(0,0,0,.38)}
*{scrollbar-width:thin;scrollbar-color:var(--putty-dark) transparent}
body{line-height:1.45;-webkit-font-smoothing:antialiased}
.raised{border-radius:var(--r);box-shadow:var(--sh);transition:background-color .12s,filter .12s}
button.raised:hover:not(:disabled){filter:brightness(1.07)}
button.raised:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.toolbar.raised:active:not(:disabled),.bmbar.raised:active:not(:disabled),.bottombar.raised:active:not(:disabled),.sheet.raised:active:not(:disabled),.popup.raised:active:not(:disabled),.sugg.raised:active:not(:disabled){border-color:var(--hi) var(--lo) var(--lo) var(--hi)}
.toolbar.raised,.bmbar.raised,.bottombar.raised{border-radius:0;box-shadow:none}
.sunken{border-radius:var(--r);box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
:focus-visible{outline:2px solid var(--teal-2);outline-offset:2px}
[data-theme="dark"] :focus-visible{outline-color:#6fd0d8}

/* title bar */
.titlebar{padding:6px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 0 rgba(0,0,0,.3);text-shadow:0 1px 1px rgba(0,0,0,.3)}
.logo{font-size:15px}
.titlebar button{border-radius:13px;padding:0 12px;line-height:24px;text-shadow:none;font-weight:600;color:var(--ink)}

/* language switch */
.langsw{display:flex;align-items:center}
.langsw button{border-radius:0;padding:0 12px;line-height:24px}
.langsw button:first-child{border-radius:13px 0 0 13px}
.langsw button:last-child{border-radius:0 13px 13px 0;border-left-width:1px}
.langsw button.on{border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:var(--amber);color:#1f2a37;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}

/* tabs */
.tabs{padding:8px 8px 0;gap:3px}
.tab{border-radius:8px 8px 0 0;padding:6px 8px;transition:background-color .12s,opacity .12s}
.tab .t{font-size:13px}
.tab .x{width:20px;height:20px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.tab .x:hover{background:rgba(0,0,0,.14)}
.tab.active .x:hover{background:rgba(255,255,255,.22);color:var(--onbar)}
.fav{border-radius:5px}
.newtab{border-radius:50%;width:30px;height:30px;min-width:0;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1;margin-bottom:2px}

/* toolbar */
.toolbar{background:linear-gradient(var(--putty-light),var(--putty));padding:8px}
.tb{border-radius:7px;font-size:15px}
.addr{border-radius:9px;padding:0 10px}
.addr:focus-within{outline:2px solid var(--teal-2);outline-offset:1px}
.addr input{font-size:14px}
.star{font-size:21px;transition:transform .12s,color .12s}
.star:hover{color:var(--amber);transform:scale(1.15)}
.sugg{border-radius:9px;box-shadow:var(--sh-pop);overflow-x:hidden}
.sg{padding:9px 12px;gap:10px}
.progress i{background:linear-gradient(90deg,var(--teal-2),var(--amber))}

/* bookmark bar + hint */
.bmbar{padding:4px 8px;gap:6px;background:var(--putty-light)}
.bm{border-radius:14px;padding:3px 10px;font-size:13px;transition:background-color .12s}
.bm:hover{background:var(--putty);border-color:var(--lo)}
.bm .fav{width:16px;height:16px;font-size:10px}
.hint{padding:5px 12px;font-size:12.5px}

/* stage + pages */
.stage{margin:8px}
.page{background-color:var(--paper);background-image:radial-gradient(rgba(124,118,99,.2) 1px,transparent 1px);background-size:18px 18px}
[data-theme="dark"] .page{background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px)}
.sheet .sbody{background-image:radial-gradient(rgba(124,118,99,.16) 1px,transparent 1px);background-size:18px 18px}
.page h1{position:relative;padding-bottom:12px;margin-bottom:16px}
.page h1::after{content:"";position:absolute;left:0;bottom:0;width:56px;height:4px;border-radius:2px;background:var(--amber)}
.page h2{font-size:14px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.page h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--teal-2);flex:none}

/* home */
.clock{color:var(--teal);text-shadow:2px 2px 0 rgba(0,0,0,.08)}
[data-theme="dark"] .clock{color:#6fd0d8;text-shadow:none}
.date{font-size:15px;margin:6px 0 2px}
.page .sub{font-size:15px}
.row .box{border-radius:9px;overflow:hidden}
.row .box input{height:42px;font-size:16px}
.row .go{height:42px;padding:0 18px;border-radius:9px;background:var(--teal);color:var(--onbar);border-color:var(--teal-2) var(--lo) var(--lo) var(--teal-2)}
.engbtn{padding:0 10px}
.dial{gap:10px}
.tile{border-radius:10px;padding:16px 8px 12px;transition:transform .12s,filter .12s}
.tile:hover{transform:translateY(-2px)}
.tile .fav{width:38px;height:38px;font-size:18px;border-radius:10px}
.tile span.n{font-size:12.5px;font-weight:600}
.etile{border-radius:10px}

/* widgets */
.btn{border-radius:16px;padding:6px 16px}
.list .it{padding:10px 6px}
.list .it:hover{background:rgba(0,0,0,.05)}
.keys button{border-radius:9px}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0}

/* popup, toast, sheet */
.popup{border-radius:11px;box-shadow:var(--sh-pop);padding:6px;animation:pop .12s ease-out}
.popup button{padding:9px 12px;border-radius:7px;gap:10px}
.popup hr{margin:5px 4px}
.toast{border-radius:9px;box-shadow:var(--sh-pop);padding:10px 16px}
.sheet{border-radius:13px 13px 0 0;box-shadow:0 -8px 26px rgba(0,0,0,.4);overflow:hidden;animation:rise .18s ease-out}
.sheet header{padding:9px 12px}
.sheet header button{border-radius:13px;padding:0 12px;line-height:24px}
.backdrop{animation:fade .15s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:.5;transform:translate(-50%,26px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* bottom bar + status */
.bottombar{padding:8px 10px;gap:10px}
.bottombar .tb{border-radius:9px}
.status{padding:4px 8px}
.status .cell{border-radius:4px}

@media (prefers-reduced-motion:reduce){
  .popup,.sheet,.backdrop{animation:none}
  .tile:hover,.star:hover{transform:none}
  .raised,.tab,.bm,.star,.tile{transition:none}
}
@media (max-width:700px){
  .tabs{padding:6px 6px 0}
  .stage{margin:6px}
  .tile{padding:14px 6px 10px}
}

/* ===== plain white pages: no dots or texture ===== */
:root,:root[data-theme="win"]{--paper:#ffffff}
:root[data-theme="dark"]{--paper:#1b1b1b}
body{background-image:none}
.page,[data-theme="dark"] .page{background-color:var(--paper);background-image:none}
.sheet .sbody{background-color:var(--paper);background-image:none}

/* ===== retro badges for search engines (original designs) ===== */
.eico.rb{position:relative;border-radius:0;font-family:"Courier Prime",monospace;text-shadow:1px 1px 0 rgba(0,0,0,.45);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.6),inset -2px -2px 0 rgba(0,0,0,.4),2px 2px 0 rgba(0,0,0,.35)}
.eico.rb::before{content:"";position:absolute;inset:13%;border:1px dashed rgba(255,255,255,.7);border-radius:inherit;pointer-events:none}
.eico.rb::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(150deg,rgba(255,255,255,.4) 0,rgba(255,255,255,0) 52%,rgba(0,0,0,.18) 100%)}
.eico.rb.s0{border-radius:50%}
.eico.rb.s1{border-radius:22%}
.eico.rb.s2{clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);box-shadow:inset 2px 2px 0 rgba(255,255,255,.6),inset -2px -2px 0 rgba(0,0,0,.4)}
.eico.rb.s3{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);box-shadow:inset 2px 2px 0 rgba(255,255,255,.6),inset -2px -2px 0 rgba(0,0,0,.4)}
.eico.rb.s4{border-radius:50% 50% 50% 50%/62% 62% 38% 38%}
.eico.rb.s2::before,.eico.rb.s3::before{border-radius:0}
.fav.ico{background:#fff}.fav img{width:100%;height:100%;object-fit:contain;padding:12%;display:block}

/* ===== Android / phone fit ===== */
html,body{height:100%;height:100dvh;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,.tab,.tile,.sg{touch-action:manipulation}
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overflow-x:hidden}
.popup{max-width:calc(100vw - 8px)}
.popup button{white-space:normal}
@media (max-width:700px){
  body{font-size:15px}
  .titlebar{padding:5px 8px;gap:6px}
  .logo{font-size:15px}
  .titlebar button{line-height:26px;padding:0 10px;font-size:13px}
  .langsw button{padding:0 9px}
  .tabs{padding:5px 5px 0}
  .tab{min-width:92px;max-width:150px;padding:6px}
  .tab.pinned{min-width:0}
  .newtab{width:34px;height:34px;flex:none}
  .toolbar{padding:5px 4px;gap:3px}
  .tb{height:40px;min-width:38px;padding:0 6px}
  .addr{height:40px}
  .addr input{font-size:16px}
  .star{font-size:24px;padding:0 4px}
  .sugg{top:42px}
  .sg{padding:12px}
  .bmbar{padding:4px 6px}
  .bm{padding:6px 10px;font-size:13px;flex:none}
  .hint{flex-wrap:wrap;gap:4px 8px;padding:5px 8px;font-size:12px}
  .stage{margin:4px}
  .page{padding:16px 12px 32px}
  .page h1{font-size:clamp(24px,8vw,32px)}
  .clock{font-size:clamp(44px,17vw,72px)}
  .row .box{flex:1 1 100%;min-width:0}
  .row .go{flex:1 1 100%;height:44px}
  .row .box input{height:44px;font-size:16px}
  .dial{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .tile{padding:12px 4px 10px}
  .enggrid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .field,.notes,.minibar input,.fieldbox input{font-size:16px}
  .notes{min-height:45vh}
  .sheet{width:100%;max-height:92%}
  .sheet header button{min-width:36px;line-height:30px}
  .sheet .page{padding:14px 12px 28px}
  .keys button{height:54px}
  .btn{padding:8px 14px;min-height:38px}
  .list .it{padding:10px 2px}
  .status{padding:3px 6px;gap:4px}
  .status .cell{padding:1px 6px}
  #zoomCell{display:none}
  .bottombar{padding:6px;gap:6px}
  .bottombar .tb{height:44px;padding:0 4px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .toast{bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:92vw;font-size:13px}
  table.k td:first-child{padding-right:8px;font-size:13px}
}
@media (max-width:380px){
  .logo{font-size:14px}
  .tb{min-width:34px}
  .bottombar .tb{font-size:12px}
  .dial{grid-template-columns:repeat(3,1fr)}
}

.logoimg{width:24px;height:24px;border-radius:5px;display:block;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.4)}
/* ===== native Android (WebView) mode ===== */
html.native,html.native body{background:transparent}
html.native .view.hole{background:transparent;box-shadow:none}
html.native .toast{pointer-events:none}
html.native .hint{display:none!important}

function calcEval(str){
  var s=str.replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-").replace(/\s+/g,""),i=0;
  function num(){var m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0]);}
  function pct(v){while(s[i]==="%"){i++;v/=100;}return v;}
  function atom(){
    if(s[i]==="("){i++;var v=expr();if(s[i]!==")")throw 0;i++;return pct(v);}
    if(s[i]==="-"){i++;return -atom();}
    if(s[i]==="+"){i++;return atom();}
    return pct(num());
  }
  function term(){var v=atom();while(s[i]==="*"||s[i]==="/"){var o=s[i++],r=atom();v=o==="*"?v*r:v/r;}return v;}
  function expr(){var v=term();while(s[i]==="+"||s[i]==="-"){var o=s[i++],r=term();v=o==="+"?v+r:v-r;}return v;}
  var v=expr();
  if(i!==s.length||!isFinite(v))throw 0;
  return +v.toFixed(10);
}

  p.style.top=Math.max(4,r.top-p.offsetHeight-6)+"px";
  p.style.left=Math.max(4,Math.min(r.left+r.width/2-p.offsetWidth/2,innerWidth-p.offsetWidth-4))+"px";
}
var sheetState=null;
function closeSheet(){
  if(!sheetState)return;
  sheetState.cl.forEach(function(f){f();});
  sheetState.back.remove();sheetState.sheet.remove();sheetState=null;
}
function openTool(k){
  closeSheet();
  var pg=PAGES[k];if(!pg||k==="about:home")return;
  var saved=cleanups;cleanups=[];
  var node=pg.fn();
  var mine=cleanups;cleanups=saved;
  var back=h("div",{class:"backdrop",onclick:closeSheet});
  var sheet=h("div",{class:"sheet raised",role:"dialog","aria-label":pTitle(k)},
    h("header",{},h("span",{text:pg.i+" "+pTitle(k)}),h("button",{class:"raised",text:"✕","aria-label":t("close"),onclick:closeSheet})),
    h("div",{class:"sbody"},node));
  var stage=document.querySelector(".stage");
  stage.appendChild(back);stage.appendChild(sheet);
  sheetState={back:back,sheet:sheet,cl:mine,k:k};
}
function openTools(){
  var r=$("toolsBtn").getBoundingClientRect();
  popupAbove([
    {i:"✎",l:pTitle("about:notes"),fn:function(){openTool("about:notes");}},
    {i:"=",l:pTitle("about:calc"),fn:function(){openTool("about:calc");}},
    {i:"◷",l:pTitle("about:timer"),fn:function(){openTool("about:timer");}},
    "-",
    {i:"★",l:pTitle("about:bookmarks"),fn:function(){openTool("about:bookmarks");}},
    {i:"☰",l:pTitle("about:history"),fn:function(){openTool("about:history");}},
    {i:"⚙",l:pTitle("about:settings"),fn:function(){openTool("about:settings");}},
    {i:"⌨",l:pTitle("about:keys"),fn:function(){openTool("about:keys");}}
  ],r);
}
function openMenu(){
  var r=$("menuBtn").getBoundingClientRect();
  popupAbove([
    {i:"🕶",l:privateMode?t("priv_off"):t("priv_on"),fn:function(){setPrivate(!privateMode);}},
    {i:"+",l:t("newtab_a"),fn:function(){newTab();}},
    {i:"◫",l:t("split_on"),fn:toggleSplit},
    "-",
    {i:"+",l:t("zoom_in"),fn:function(){setZoom(10);}},
    {i:"−",l:t("zoom_out"),fn:function(){setZoom(-10);}},
    {i:"↗",l:t("open_ext"),fn:openExt},
    NB?null:{i:"⛶",l:t("fullscreen"),fn:function(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){toast(t("fs_fail"));}}}
  ].filter(Boolean),r);
}
function openExt(){var u=curUrl();if(u&&!isInternal(u)){if(NB)NB.openExternal(u);else window.open(u,"_blank","noopener");}else toast(t("builtin"));}

/* ===== wiring ===== */
el.back.addEventListener("click",goBack);
el.fwd.addEventListener("click",goFwd);
$("reload").addEventListener("click",reload);
$("home").addEventListener("click",function(){navigate("about:home");});
el.star.addEventListener("click",toggleBm);
$("zin").addEventListener("click",function(){setZoom(10);});
$("zout").addEventListener("click",function(){setZoom(-10);});
$("zval").addEventListener("click",function(){setZoom(0);});
el.split.addEventListener("click",toggleSplit);
$("menuBtn").addEventListener("click",function(e){e.stopPropagation();openMenu();});
$("themeBtn").addEventListener("click",cycleTheme);
$("langBn").addEventListener("click",function(){setLang("bn");});
$("langEn").addEventListener("click",function(){setLang("en");});
$("toolsBtn").addEventListener("click",function(e){e.stopPropagation();openTools();});
$("hintOpen").addEventListener("click",openExt);
$("hintClose").addEventListener("click",function(){hintHidden=true;el.hint.style.display="none";});

document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closePopup();closeSheet();}
  var k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(k==="l"||k==="t"||k==="w")){e.preventDefault();}
  else if(!e.altKey)return;
  else e.preventDefault();
  if(k==="t")newTab();
  else if(k==="w")closeTab(active);
  else if(k==="l"){el.url.focus();}
  else if(k==="r")reload();
  else if(k==="d")toggleBm();
  else if(k==="s")toggleSplit();
  else if(k==="p")setPrivate(!privateMode);
  else if(e.key==="ArrowLeft")goBack();
  else if(e.key==="ArrowRight")goFwd();
  else if(k==="+"||k==="=")setZoom(10);
  else if(k==="-")setZoom(-10);
  else if(/^[1-9]$/.test(k)){var x=tabs[parseInt(k,10)-1];if(x){active=x.id;render();}}
});

/* ===== native (Android WebView) glue ===== */
var paneEl={m:null,s:null};
function bump(x){x.rev=(x.rev||0)+1;x.fresh=true;x.title="";}
function tabByKey(key){var id=parseInt(key.slice(1),10),r=null;tabs.forEach(function(x){if(x.id===id)r=x;});return r;}
function rectOf(e){var r=e.getBoundingClientRect();return {l:r.left,t:r.top,w:r.width,h:r.height};}
function fillRect(o,el){
  if(!el||!el.isConnected)return;
  var b=rectOf(el);
  if(b.w>0&&b.h>0){o.vis=true;o.l=b.l;o.t=b.t;o.w=b.w;o.h=b.h;}
}
function nativeSync(){
  if(!NB)return;
  var views=[],overlay=!!$("popup")||!!sheetState||el.sugg.classList.contains("open");
  tabs.forEach(function(x){
    var u=x.stack[x.idx],on=x.id===active,e;
    if(!isInternal(u)){
      e={k:"t"+x.id,u:u,r:x.rev||0,z:x.zoom,vis:false};
      if(on)fillRect(e,paneEl.m);
      views.push(e);
    }
    if(x.split&&!isInternal(x.split.url)){
      e={k:"s"+x.id,u:x.split.url,r:x.split.rev||0,z:x.zoom,vis:false};
      if(on)fillRect(e,paneEl.s);
      views.push(e);
    }
  });
  try{NB.sync(JSON.stringify({o:overlay,v:views}));}catch(err){}
}
var syncQ=0;
function queueSync(){if(syncQ)return;syncQ=requestAnimationFrame(function(){syncQ=0;nativeSync();});}
function setProgress(p){
  var b=el.bar;clearTimeout(pt);
  b.style.transition="width .2s";b.style.opacity="1";b.style.width=p+"%";
  if(p>=100){setStatus(t("done")+hostOf(curUrl()||""));pt=setTimeout(function(){b.style.opacity="0";},350);}
  else if(p<=10){setLoading(curUrl()||"");}
}
function chrome(){
  var x=cur(),u=x.stack[x.idx];
  renderTabs();
  if(document.activeElement!==el.url)el.url.value=isInternal(u)?"":u;
  el.back.disabled=x.idx<=0;el.fwd.disabled=x.idx>=x.stack.length-1;
  renderStar();document.title=titleFor(u)+t("doc_suffix");persist();
}
window.__nat={
  nav:function(key,url){
    var x=tabByKey(key);if(!x)return;
    if(key.charAt(0)==="s"){
      if(x.split){x.split.url=url;if(x.split.inp&&document.activeElement!==x.split.inp)x.split.inp.value=url;}
      return;
    }
    if(isInternal(x.stack[x.idx]))return;
    if(x.stack[x.idx]===url)return;
    x.title="";
    if(x.fresh)x.stack[x.idx]=url;
    else{x.stack=x.stack.slice(0,x.idx+1);x.stack.push(url);x.idx++;}
    addHistory(url);
    if(x.id===active)chrome();else renderTabs();
  },
  done:function(key){var x=tabByKey(key);if(x&&key.charAt(0)==="t")x.fresh=false;},
  progress:function(key,p){var x=cur();if(!x||key!=="t"+x.id)return;setProgress(p);},
  title:function(key,s){var x=tabByKey(key);if(!x||key.charAt(0)!=="t")return;x.title=s||"";renderTabs();},
  openUrl:function(u){newTab(u);}
};
window.nativeBack=function(){
  if($("popup")){closePopup();return true;}
  if(sheetState){closeSheet();return true;}
  if(el.sugg.classList.contains("open")){hideSugg();el.url.blur();return true;}
  var x=cur();
  if(x.split){x.split=null;render();return true;}
  if(x.idx>0){goBack();return true;}
  if(tabs.length>1){closeTab(x.id);return true;}
  return false;
};
if(NB){
  el.view.classList.add("hole");
  new MutationObserver(queueSync).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
  addEventListener("resize",queueSync);
  if(window.ResizeObserver)new ResizeObserver(queueSync).observe(el.view);
  document.addEventListener("pointerdown",function(e){
    if(document.activeElement===el.url&&!e.target.closest(".addrwrap"))el.url.blur();
  },true);
}

/* ===== start ===== */
applyStatic();
setTheme(settings.theme);
renderBm();
var ses=lsGet("session",null);
if(ses&&ses.tabs&&ses.tabs.length){
  ses.tabs.forEach(function(s){
    tabs.push({id:++seq,stack:(s.stack&&s.stack.length?s.stack:["about:home"]).map(function(u){return (typeof u!=="string"||(isInternal(u)&&u!=="about:home"))?"about:home":u;}),idx:Math.min(s.idx||0,(s.stack||[1]).length-1),pinned:!!s.pinned,zoom:s.zoom||100,split:null,rev:0,fresh:true,title:""});
  });
  active=(tabs[ses.active]||tabs[0]).id;
  render();
}else newTab();
})();
</script>
